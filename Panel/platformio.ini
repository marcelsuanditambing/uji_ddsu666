; Opsional: untuk PlatformIO (VS Code). Arduino IDE tidak memerlukan file ini.
[platformio]
src_dir = APFC_Panel

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
